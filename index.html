<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🤰 老婆专属 · 孕期私厨</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#fdf6f0;color:#333;padding-bottom:150px}
.header{background:linear-gradient(135deg,#e4958b,#d4786e);color:#fff;padding:20px;text-align:center}
.header h1{font-size:20px;margin-bottom:2px}
.header p{font-size:12px;opacity:.88}
.tabs{display:flex;background:#fff;position:sticky;top:0;z-index:10;box-shadow:0 1px 3px rgba(0,0,0,.06);overflow-x:auto;-webkit-overflow-scrolling:touch}
.tab{flex-shrink:0;text-align:center;padding:12px 14px;font-size:13px;border:none;background:none;cursor:pointer;color:#999;border-bottom:2px solid transparent;transition:.2s}
.tab.active{color:#d4786e;border-bottom-color:#d4786e;font-weight:600}
.tag-row{display:flex;gap:6px;padding:8px 12px;overflow-x:auto;background:#fdf6f0}
.tag{padding:4px 10px;border-radius:12px;font-size:11px;white-space:nowrap;border:1px solid #e8d5cf;background:#fff;color:#b0806e;cursor:pointer;transition:.2s}
.tag.active{background:#d4786e;color:#fff;border-color:#d4786e}
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
@media(min-width:600px){.menu-grid{grid-template-columns:1fr 1fr 1fr}}
.dish-card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.05);cursor:pointer;transition:transform .15s}
.dish-card:active{transform:scale(.97)}
.dish-emoji{font-size:50px;text-align:center;padding:14px 0 6px}
.dish-info{padding:0 10px 12px}
.dish-name{font-size:14px;font-weight:600;margin-bottom:1px}
.dish-desc{font-size:11px;color:#999;margin-bottom:6px;line-height:1.4}
.dish-tags{display:flex;gap:4px;flex-wrap:wrap}
.dish-tag{font-size:9px;padding:2px 6px;border-radius:6px}
.dish-tag.nutri{background:#fef3e4;color:#d4883c}
.dish-tag.best{background:#fde8e5;color:#d4786e}
.cart-bar{position:fixed;bottom:0;left:0;right:0;background:#fff;box-shadow:0 -2px 12px rgba(0,0,0,.08);padding:12px 16px;z-index:100;display:flex;align-items:center;gap:12px}
.cart-info{flex:1}
.cart-count{font-size:12px;color:#999}
.cart-total{font-size:18px;font-weight:700;color:#d4786e}
.cart-btn{padding:12px 28px;background:linear-gradient(135deg,#e4958b,#d4786e);color:#fff;border:none;border-radius:25px;font-size:15px;font-weight:600;cursor:pointer;white-space:nowrap}
.cart-btn:active{opacity:.8}
.cart-btn:disabled{background:#ccc}
.modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:200;align-items:flex-end;justify-content:center}
.modal.show{display:flex}
.modal-content{background:#fff;border-radius:18px 18px 0 0;width:100%;max-width:500px;max-height:75vh;overflow-y:auto;padding:20px}
.modal-title{font-size:17px;font-weight:700;margin-bottom:14px;text-align:center}
.cart-item{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f5f0ee}
.cart-item-name{font-size:14px;flex:1}
.cart-item-btn{width:28px;height:28px;border-radius:50%;border:1px solid #ddd;background:#fff;font-size:16px;cursor:pointer;color:#999;line-height:1}
.cart-item-btn.minus{color:#d4786e;border-color:#d4786e}
.cart-item-qty{font-size:14px;margin:0 8px;min-width:20px;text-align:center}
.empty-cart{text-align:center;color:#999;padding:40px 0;font-size:14px}
.note-input{width:100%;padding:12px;border:1px solid #eee;border-radius:8px;font-size:14px;margin-top:12px;resize:none;font-family:inherit}
.submit-btn{width:100%;padding:14px;background:linear-gradient(135deg,#e4958b,#d4786e);color:#fff;border:none;border-radius:25px;font-size:16px;font-weight:600;cursor:pointer;margin-top:12px;transition:.2s}
.submit-btn:hover{opacity:.9}
.submit-btn:active{opacity:.8}
.recipe-modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:300;align-items:center;justify-content:center}
.recipe-modal.show{display:flex}
.recipe-content{background:#fff;border-radius:16px;width:92%;max-width:500px;max-height:80vh;overflow-y:auto;padding:20px}
.recipe-emoji{font-size:60px;text-align:center}
.recipe-name{font-size:20px;font-weight:700;text-align:center;margin:8px 0 4px}
.recipe-nutri{text-align:center;font-size:12px;color:#999;margin-bottom:14px}
.recipe-section{margin-bottom:14px}
.recipe-section h3{font-size:15px;color:#d4786e;margin-bottom:6px;border-bottom:1px solid #f5e8e5;padding-bottom:4px}
.recipe-section p,.recipe-section li{font-size:13px;line-height:1.8;color:#555}
.recipe-section ul{padding-left:18px}
.recipe-section li{margin-bottom:2px}
.recipe-close{width:100%;padding:12px;background:#f5f0ee;border:none;border-radius:25px;font-size:14px;cursor:pointer;margin-top:8px;color:#888}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:12px 24px;border-radius:25px;font-size:14px;z-index:400;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.header-tip{background:#fef9f5;text-align:center;padding:8px;font-size:11px;color:#c09080;border-bottom:1px solid #f5e8e5}
.orders-panel{margin-top:6px;padding:0 10px 10px}
.orders-panel h3{font-size:13px;color:#d4786e;margin-bottom:6px}
.order-history-item{background:#fff;border-radius:10px;padding:8px 10px;margin-bottom:6px;box-shadow:0 1px 3px rgba(0,0,0,.04);display:flex;justify-content:space-between;align-items:center}
.order-history-item .order-info{flex:1}
.order-history-item .order-time{font-size:10px;color:#bbb}
.order-history-item .order-items{font-size:12px;color:#555;margin-top:2px}
.order-history-item .order-note{font-size:11px;color:#d4786e;margin-top:2px}
.order-history-item .order-status{font-size:11px;padding:2px 8px;border-radius:10px}
.order-status.done{background:#e8f5e9;color:#4caf50}
.order-status.pending{background:#fff3e0;color:#ff9800}
.order-actions{display:flex;gap:4px}
.order-action-btn{font-size:10px;padding:3px 8px;border-radius:8px;border:none;cursor:pointer}
.order-action-btn.done{background:#e8f5e9;color:#4caf50}
.order-action-btn.delete{background:#fde8e5;color:#d4786e}
.orders-toggle{text-align:center;padding:8px;font-size:12px;color:#999;cursor:pointer;border:none;background:none;width:100%}
.orders-toggle:hover{color:#d4786e}
</style>
</head>
<body>

<div class="header">
  <h1>🤰 老婆孕期私厨</h1>
  <p>每道菜都为你和宝宝精心挑选 · 手机存着随时点</p>
</div>
<div class="header-tip">💡 点击菜品卡片查看做法 · 孕期饮食请注意食材新鲜卫生</div>

<div class="tabs" id="tabs"></div>
<div class="tag-row" id="tagRow"></div>
<div class="menu-grid" id="menu"></div>

<button class="orders-toggle" id="ordersToggle" onclick="toggleOrders()">📋 查看历史下单记录 ▼</button>
<div class="orders-panel" id="ordersPanel" style="display:none">
  <h3>📋 老婆的历史点单</h3>
  <div id="orderHistory"></div>
  <p style="text-align:center;font-size:11px;color:#ccc;margin-top:8px" id="orderCount"></p>
</div>

<div class="cart-bar">
  <div class="cart-info">
    <div class="cart-count" id="cartCount">未选菜品</div>
    <div class="cart-total" id="cartTotal">给老婆做 ❤️</div>
  </div>
  <button class="cart-btn" id="cartBtn" onclick="openCart()">去下单 💝</button>
</div>

<div class="modal" id="cartModal">
  <div class="modal-content">
    <div class="modal-title">🛒 今天想吃什么</div>
    <div id="cartItems"></div>
    <textarea class="note-input" id="orderNote" placeholder="备注：比如胃口怎么样、特别想吃什么口味..."></textarea>
    <button class="submit-btn" onclick="submitOrder()">💝 告诉老公</button>
    <button style="width:100%;padding:12px;background:none;border:none;color:#999;font-size:14px;margin-top:8px;cursor:pointer" onclick="closeCart()">继续看看别的菜</button>
  </div>
</div>

<div class="recipe-modal" id="recipeModal">
  <div class="recipe-content" id="recipeContent"></div>
</div>

<div class="toast" id="toast"></div>

": ["鸡蛋打散，加温水搅匀，加少许盐", "虾皮用温水泡一下沥干，均匀撒入蛋液中", "蛋液过筛倒入碗中，盖上耐热保鲜膜，扎几个小孔", "蒸锅水开后放入，中小火蒸10分钟", "取出揭开保鲜膜，淋生抽和香油", "撒上葱花即可"], "tip": "虾皮本身有咸味，盐要少放。蛋液过筛蒸出来更细腻。孕晚期补钙需求大，这道菜可以一周吃2-3次。", "name": "虾皮蒸蛋羹(补钙版)"}, "排骨玉米汤": {"emoji": "🌽", "tags": ["补钙", "清甜", "家常汤"], "desc": "排骨软烂玉米清甜，汤鲜味美全家爱喝", "cat": "补钙壮骨", "nutrition": "排骨富含钙质和胶原蛋白，炖汤时骨中的钙会部分溶出。玉米含有膳食纤维和B族维生素，清甜爽口有助缓解孕期便秘。", "ingredients": ["猪排骨 500g", "甜玉米 2根", "胡萝卜 1根", "姜 4片", "葱 1根", "料酒 2勺", "盐 适量"], "steps": ["排骨斩段，冷水下锅加姜片料酒焯水去血沫，捞出洗净", "玉米切段，胡萝卜切滚刀块", "排骨放入汤锅，加足量清水、姜片、葱段", "大火烧开后转小火炖1小时", "加入玉米和胡萝卜，继续炖30分钟", "加盐调味即可"], "tip": "想汤更鲜可以加几滴醋帮助钙溶出。玉米选甜玉米口感更好，糯玉米更适合焖煮。", "name": "排骨玉米汤"}, "芝麻酱拌菠菜": {"emoji": "🥬", "tags": ["高钙", "补铁", "凉拌"], "desc": "芝麻酱浓郁醇香，菠菜清爽嫩口，补钙佳品", "cat": "补钙壮骨", "nutrition": "芝麻酱钙含量极高（每100g含钙约1170mg），是补钙佳品。菠菜富含铁和叶酸，两者搭配补钙补铁两不误。注意菠菜须焯水去草酸。", "ingredients": ["菠菜 300g", "芝麻酱 2勺", "温水 3勺（调芝麻酱用）", "生抽 1勺", "香醋 半勺", "蒜末 1勺", "熟白芝麻 少许"], "steps": ["菠菜洗净去根，沸水加少许盐和油焯烫30秒，捞出过凉水", "菠菜挤干水分，切段备用", "芝麻酱用温水调开至顺滑，加生抽、香醋、蒜末搅匀", "菠菜装盘，浇上调好的芝麻酱", "撒上熟白芝麻即可"], "tip": "芝麻酱用温水一点点加，慢慢搅拌就能调开。菠菜必须焯水去草酸否则影响钙吸收。", "name": "芝麻酱拌菠菜"}, "鲫鱼豆腐汤": {"emoji": "🐟", "tags": ["补钙", "高蛋白", "下奶"], "desc": "汤色奶白如乳，鲫鱼鲜嫩豆腐滑嫩", "cat": "补钙壮骨", "nutrition": "鲫鱼富含优质蛋白和钙，豆腐钙含量丰富，两者炖汤钙蛋白双补。鲫鱼豆腐汤传统上也是催乳汤品，孕晚期和产后都适宜。", "ingredients": ["鲫鱼 2条（约500g）", "嫩豆腐 1块（约300g）", "姜 5片", "葱 2根", "料酒 2勺", "盐 适量", "食用油 适量"], "steps": ["鲫鱼处理干净，两面拍干水分，抹少许盐腌制5分钟", "豆腐切块，姜切片，葱切段", "热锅放油，下鲫鱼煎至两面金黄（用中小火）", "倒入开水（一定要开水！），加姜片、葱段、料酒", "大火滚煮10分钟至汤色变白", "放入豆腐，转中火继续煮10分钟", "加盐调味即可"], "tip": "汤色奶白的秘诀是：鱼先煎黄，加开水大火煮。一定不要加冷水，否则汤不白。", "name": "鲫鱼豆腐汤"}, "山药排骨汤": {"emoji": "🍲", "tags": ["补钙", "健脾", "养胃"], "desc": "山药绵软排骨香，温和滋补养脾胃", "cat": "补钙壮骨", "nutrition": "排骨富含钙质和蛋白质，山药健脾益胃，含有多种维生素和矿物质。这道汤温补但不燥热，非常适合孕期调理脾胃。", "ingredients": ["猪排骨 400g", "铁棍山药 2根（约300g）", "姜 4片", "枸杞 1小把", "料酒 2勺", "盐 适量"], "steps": ["排骨斩段，冷水下锅加姜片料酒焯水去血沫，捞出洗净", "山药戴手套去皮切段（防痒），放入水中防氧化", "排骨入砂锅，加足量清水和姜片", "大火烧开后转小火炖1小时", "加入山药段，继续炖30分钟至山药软绵", "出锅前5分钟放入枸杞，加盐调味即可"], "tip": "处理山药要戴手套，不然手会痒。山药不要过早放，煮太久会化在汤里。用铁棍山药口感更好。", "n function getAllTags() {
  const s = new Set();
  for (const d of Object.values(DISH_DATA)) d.tags.forEach(t => s.add(t));
  return [...s];
}

function renderTabs() {
  document.getElementById('tabs').innerHTML = CATEGORIES.map((c,i)=>
    `<button class="tab${i===activeCat?' active':''}" onclick="switchTab(${i})">${c[0]}</button>`
  ).join('');
}

function renderTags() {
  const tags = ['全部', ...getAllTags()];
  document.getElementById('tagRow').innerHTML = tags.map(t=>
    `<button class="tag${t===activeTag?' active':''}" onclick="filterTag('${t}')">${t}</button>`
  ).join('');
}

function renderMenu() {
  const cat = CATEGORIES[activeCat];
  const dishNames = cat[2];

  if (activeTag !== '全部') {
    items = items.filter(item => item.tags.includes(activeTag));

  if (items.length === 0) {

    <div class="recipe-section">
      <h3>👨‍🍳 做法</h3>
      <ol>${r.steps.map((s,i) => `<li>${s}</li>`).join('')}</ol>
    </div>
    ${r.tip ? `<div class="recipe-section">
      <h3>💡 老公小贴士</h3>
      <p>${r.tip}</p>
    </div>` : ''}
    <button class="recipe-close" onclick="document.getElementById('recipeModal').classList.remove('show')">关闭</button>
    <button class="submit-btn" style="margin-top:8px" onclick="addToCart('${item.name.replace(/'/g,"\\'")}');document.getElementById('recipeModal').classList.remove('show');showToast('已加入：${item.name}')">＋ 加入点菜单</button>
  `;
  document.getElementById('recipeModal').classList.add('show');
}
document.getElementById('recipeModal').addEventListener('click', function(e){
  if (e.target === this) this.classList.remove('show');
});

function switchTab(i) { activeCat = i; renderTabs(); renderMenu(); }
function filterTag(t) { activeTag = t; renderTags(); renderMenu(); }

function addToCart(name) {
  cart[name] = (cart[name] || 0) + 1;
  saveCart();
  showToast('已加入：' + name);
}

function removeFromCart(name) {
  if (cart[name] > 1) cart[name]--;
  else delete cart[name];
  saveCart();
  renderCartItems();
}

function saveCart() {
  localStorage.setItem('menu_cart', JSON.stringify(cart));
  updateBar();
}

function updateBar() {
  const names = Object.keys(cart);
  const cnt = names.reduce((s,n) => s + cart[n], 0);
  document.getElementById('cartCount').textContent = cnt === 0 ? '未选菜品' : `已选 ${cnt} 道菜（${names.length}种）`;
  document.getElementById('cartBtn').disabled = cnt === 0;
}

function openCart() {
  document.getElementById('cartModal').classList.add('show');
  renderCartItems();
}
function closeCart() { document.getElementById('cartModal').classList.remove('show'); }

function renderCartItems() {
  const names = Object.keys(cart);
  const container = document.getElementById('cartItems');
  if (names.length === 0) {
    container.innerHTML = '<div class="empty-cart">🛒 还没选菜呢，去菜单看看吧~</div>';
    return;
  }
  container.innerHTML = names.map(name => `
    <div class="cart-item">
      <span class="cart-item-name">${name}</span>
      <button class="cart-item-btn minus" onclick="removeFromCart('${name.replace(/'/g,"\\'")}')">−</button>
      <span class="cart-item-qty">${cart[name]}</span>
      <button class="cart-item-btn" onclick="addToCart('${name.replace(/'/g,"\\'")}')">+</button>
    </div>
  `).join('');
}

function submitOrder() {
  const items = Object.entries(cart).map(([name, qty]) => ({ name, qty }));
  if (items.length === 0) return;
  const note = document.getElementById('orderNote').value.trim();
  const now = new Date();
  const timeStr = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0') + ' ' + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
  const order = {
    id: Date.now(),
    items,
    note,
    time: timeStr,
    done: false
  };
  orders.unshift(order);
  localStorage.setItem('menu_orders', JSON.stringify(orders));
  cart = {};
  saveCart();
  closeCart();
  document.getElementById('orderNote').value = '';
  showToast('💝 告诉老公啦！等着吃好吃的吧~');
  renderOrderHistory();
}

function toggleOrders() {
  const panel = document.getElementById('ordersPanel');
  const btn = document.getElementById('ordersToggle');
  if (panel.style.display === 'none') {
    panel.style.display = 'block';
    btn.textContent = '📋 收起历史记录 ▲';
    renderOrderHistory();
  } else {
    panel.style.display = 'none';
    btn.textContent = '📋 查看历史下单记录 ▼';
  }
}

function renderOrderHistory() {
  const container = document.getElementById('orderHistory');
  if (orders.length === 0) {
    container.innerHTML = '<div style="text-align:center;color:#999;padding:20px">还没有下过单呢，去选菜吧~</div>';
    document.getElementById('orderCount').textContent = '';
    return;
  }
  container.innerHTML = orders.map(o => `
    <div class="order-history-item">
      <div class="order-info">
        <div class="order-time">${o.time}</div>
        <div class="order-items">${o.items.map(i => i.name + (i.qty > 1 ? ' ×' + i.qty : '')).join('、')}</div>
        ${o.note ? `<div class="order-note">💬 ${o.note}</div>` : ''}
      </div>
      <div style="display:flex;flex-direction:column;gap:4px;align-items:flex-end">
        <span class="order-status ${o.done ? 'done' : 'pending'}">${o.done ? '✅ 已做' : '⏳ 待做'}</span>
        <div class="order-actions">
          <button class="order-action-btn done" onclick="toggleOrderDone(${o.id})">${o.done ? '↩' : '✅'}</button>
          <button class="order-action-btn delete" onclick="deleteOrder(${o.id})">🗑</button>
        </div>
      </div>
    </div>
  `).join('');
  document.getElementById('orderCount').textContent = `共 ${orders.length} 次点单`;
}

function toggleOrderDone(id) {
  for (const o of orders) { if (o.id === id) { o.done = !o.done; break; } }
  localStorage.setItem('menu_orders', JSON.stringify(orders));
  renderOrderHistory();
}

function deleteOrder(id) {
  orders = orders.filter(o => o.id !== id);
  localStorage.setItem('menu_orders', JSON.stringify(orders));
  renderOrderHistory();
  showToast('已删除该记录');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// ========== INIT ==========
renderTabs();
renderTags();
renderMenu();
updateBar();
</script>
</body>
</html>

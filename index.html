<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🤰 老婆孕期私厨</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#fdf6f0;color:#333;padding-bottom:150px}
.header{background:linear-gradient(135deg,#e4958b,#d4786e);color:#fff;padding:20px;text-align:center}
.header h1{font-size:20px;margin-bottom:2px}
.header p{font-size:12px;opacity:.88}
.tabs{display:flex;background:#fff;position:sticky;top:0;z-index:10;box-shadow:0 1px 3px rgba(0,0,0,.06);overflow-x:auto;-webkit-overflow-scrolling:touch}
.tab{flex-shrink:0;text-align:center;padding:12px 14px;font-size:13px;border:none;background:none;cursor:pointer;color:#999;border-bottom:2px solid transparent;transition:.2s}
.tab.active{color:#d4786e;border-bottom-color:#d4786e;font-weight:600}
.tag-row{display:flex;gap:6px;padding:8px 12px;overflow-x:auto;background:#fdf6f0}
.tag{padding:4px 10px;border-radius:12px;font-size:11px;white-space:nowrap;border:1px solid #e8d5cf;background:#fff;color:#b0806e;cursor:pointer;transition:.2s}
.tag.active{background:#d4786e;color:#fff;border-color:#d4786e}
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
@media(min-width:600px){.menu-grid{grid-template-columns:1fr 1fr 1fr}}
.dish-card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.05);cursor:pointer;transition:transform .15s}
.dish-card:active{transform:scale(.97)}
.dish-emoji{font-size:50px;text-align:center;padding:14px 0 6px}
.dish-info{padding:0 10px 12px}
.dish-name{font-size:14px;font-weight:600;margin-bottom:1px}
.dish-desc{font-size:11px;color:#999;margin-bottom:6px;line-height:1.4}
.dish-tags{display:flex;gap:4px;flex-wrap:wrap}
.dish-tag{font-size:9px;padding:2px 6px;border-radius:6px;background:#fef3e4;color:#d4883c}
.cart-bar{position:fixed;bottom:0;left:0;right:0;background:#fff;box-shadow:0 -2px 12px rgba(0,0,0,.08);padding:12px 16px;z-index:100;display:flex;align-items:center;gap:12px}
.cart-info{flex:1}
.cart-count{font-size:12px;color:#999}
.cart-total{font-size:18px;font-weight:700;color:#d4786e}
.cart-btn{padding:12px 28px;background:linear-gradient(135deg,#e4958b,#d4786e);color:#fff;border:none;border-radius:25px;font-size:15px;font-weight:600;cursor:pointer;white-space:nowrap}
.cart-btn:disabled{background:#ccc}
.modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:200;align-items:flex-end;justify-content:center}
.modal.show{display:flex}
.modal-content{background:#fff;border-radius:18px 18px 0 0;width:100%;max-width:500px;max-height:75vh;overflow-y:auto;padding:20px}
.modal-title{font-size:17px;font-weight:700;margin-bottom:14px;text-align:center}
.cart-item{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f5f0ee}
.cart-item-name{font-size:14px;flex:1}
.cart-item-btn{width:28px;height:28px;border-radius:50%;border:1px solid #ddd;background:#fff;font-size:16px;cursor:pointer;color:#999;line-height:1}
.cart-item-btn.minus{color:#d4786e;border-color:#d4786e}
.cart-item-qty{font-size:14px;margin:0 8px;min-width:20px;text-align:center}
.empty-cart{text-align:center;color:#999;padding:40px 0;font-size:14px}
.note-input{width:100%;padding:12px;border:1px solid #eee;border-radius:8px;font-size:14px;margin-top:12px;resize:none;font-family:inherit}
.submit-btn{width:100%;padding:14px;background:linear-gradient(135deg,#e4958b,#d4786e);color:#fff;border:none;border-radius:25px;font-size:16px;font-weight:600;cursor:pointer;margin-top:12px}
.recipe-modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:300;align-items:center;justify-content:center}
.recipe-modal.show{display:flex}
.recipe-content{background:#fff;border-radius:16px;width:92%;max-width:500px;max-height:80vh;overflow-y:auto;padding:20px}
.recipe-emoji{font-size:60px;text-align:center}
.recipe-name{font-size:20px;font-weight:700;text-align:center;margin:8px 0 4px}
.recipe-nutri{text-align:center;font-size:12px;color:#999;margin-bottom:14px}
.recipe-section{margin-bottom:14px}
.recipe-section h3{font-size:15px;color:#d4786e;margin-bottom:6px;border-bottom:1px solid #f5e8e5;padding-bottom:4px}
.recipe-section p,.recipe-section li{font-size:13px;line-height:1.8;color:#555}
.recipe-section ul{padding-left:18px}
.recipe-close{width:100%;padding:12px;background:#f5f0ee;border:none;border-radius:25px;font-size:14px;cursor:pointer;margin-top:8px;color:#888}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:12px 24px;border-radius:25px;font-size:14px;z-index:400;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.header-tip{background:#fef9f5;text-align:center;padding:8px;font-size:11px;color:#c09080;border-bottom:1px solid #f5e8e5}
.history-area{padding:10px}
.history-title{font-size:13px;color:#d4786e;cursor:pointer;text-align:center;padding:4px}
.history-item{background:#fff;border-radius:10px;padding:8px 10px;margin-bottom:6px;box-shadow:0 1px 3px rgba(0,0,0,.04);display:flex;justify-content:space-between}
.history-item .hi-info{flex:1}
.history-item .hi-time{font-size:10px;color:#bbb}
.history-item .hi-items{font-size:12px;color:#555;margin-top:2px}
.history-item .hi-note{font-size:11px;color:#d4786e;margin-top:2px}
.status-badge{font-size:10px;padding:2px 8px;border-radius:10px}
.status-badge.done{background:#e8f5e9;color:#4caf50}
.status-badge.pending{background:#fff3e0;color:#ff9800}
.history-actions{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.history-action-btn{font-size:10px;padding:3px 8px;border-radius:8px;border:none;cursor:pointer}
</style>
</head>
<body>
<div class="header">
  <h1>🤰 老婆孕期私厨</h1>
  <p>每道菜都为你和宝宝精心挑选 · 手机存着随时点</p>
</div>
<div class="header-tip">💡 点击菜品查看做法 · 孕早期注意补充叶酸和优质蛋白</div>
<div class="tabs" id="tabs"></div>
<div class="tag-row" id="tagRow"></div>
<div class="menu-grid" id="menu"></div>

<div class="history-area">
  <div class="history-title" id="historyTitle" onclick="toggleHistory()">📋 查看老婆的点单记录 ▼</div>
  <div id="historyContent" style="display:none"></div>
</div>

<div class="cart-bar">
  <div class="cart-info">
    <div class="cart-count" id="cartCount">未选菜品</div>
    <div class="cart-total" id="cartTotal">给老婆做 ❤️</div>
  </div>
  <button class="cart-btn" id="cartBtn" onclick="openCart()">去下单 💝</button>
</div>

<div class="modal" id="cartModal">
  <div class="modal-content">
    <div class="modal-title">🛒 今天想吃什么</div>
    <div id="cartItems"></div>
    <textarea class="note-input" id="orderNote" placeholder="备注：今天胃口怎么样？特别想吃什么口味？"></textarea>
    <button class="submit-btn" onclick="submitOrder()">💝 告诉老公</button>
    <button style="width:100%;padding:12px;background:none;border:none;color:#999;font-size:14px;margin-top:8px;cursor:pointer" onclick="closeCart()">继续看看别的菜</button>
  </div>
</div>

<div class="recipe-modal" id="recipeModal">
  <div class="recipe-content" id="recipeContent"></div>
</div>
<div class="toast" id="toast"></div>

function renderTags(){var a=['全部'].concat(allTags());var h='';for(var i=0;i<a.length;i++){h+='<button class="tag'+(a[i]===activeTag?' active':'')+'" onclick="filterTag(\''+a[i]+'\')">'+a[i]+'</button>'}document.getElementById('tagRow').innerHTML=h}
function esc(s){return s.replace(/'/g,"\\'").replace(/"/g,'&quot;')}
function renderMenu(){var names=CATEGORIES[activeCat][2];var items=[];for(var i=0;i<names.length;i++){var d=DISH_DATA[names[i]];if(d&&(activeTag==='全部'||d.tags.indexOf(activeTag)!==-1))items.push(d)}var g=document.getElementById('menu');if(items.length===0){g.innerHTML='<div style="text-align:center;color:#999;padding:40px;grid-column:1/-1">没有符合条件的菜品~</div>';return}var h='';for(var i=0;i<items.length;i++){var it=items[i];var en=esc(it.name);h+='<div class="dish-card"><div class="dish-emoji" onclick="showRecipe(\''+esc(it.name)+'\')">'+it.emoji+'</div><div class="dish-info"><div class="dish-name">'+it.name+'</div><div class="dish-desc">'+it.desc+'</div><div class="dish-tags">';for(var j=0;j<it.tags.length;j++){h+='<span class="dish-tag">'+it.tags[j]+'</span>'}h+='</div><div style="display:flex;gap:6px;margin-top:8px"><button style="flex:1;padding:6px;border-radius:15px;border:1px solid #d4786e;background:#fff;color:#d4786e;font-size:11px;cursor:pointer" onclick="event.stopPropagation();showRecipe(\''+en+'\')">📖 做法</button><button style="flex:1;padding:6px;border-radius:15px;border:none;background:#d4786e;color:#fff;font-size:11px;cursor:pointer" onclick="event.stopPropagation();addToCart(\''+en+'\')">＋点菜</button></div></div></div>'}g.innerHTML=h}
function switchTab(i){activeCat=i;renderTabs();renderMenu()}
function filterTag(t){activeTag=t;renderTags();renderMenu()}

function showRecipe(n){var it=findDish(n);if(!it)return;var r=it;var h='<div class="recipe-emoji">'+it.emoji+'</div><div class="recipe-name">'+it.name+'</div><div class="recipe-nutri">'+r.nutrition+'</div><div class="recipe-section"><h3>🛒 食材</h3><ul>';for(var i=0;i<r.ingredients.length;i++){h+='<li>'+r.ingredients[i]+'</li>'}h+='</ul></div><div class="recipe-section"><h3>👨‍🍳 做法</h3><ol>';for(var i=0;i<r.steps.length;i++){h+='<li>'+r.steps[i]+'</li>'}h+='</ol></div>';if(r.tip){h+='<div class="recipe-section"><h3>💡 老公小贴士</h3><p>'+r.tip+'</p></div>'}h+='<button class="recipe-close" onclick="closeRecipe()">关闭</button><button class="submit-btn" style="margin-top:8px" onclick="addToCart(\''+esc(it.name)+'\');closeRecipe();showToast(\''+'已加入：'+it.name+'\')">＋ 加入点菜单</button>';document.getElementById('recipeContent').innerHTML=h;document.getElementById('recipeModal').classList.add('show')}
function closeRecipe(){document.getElementById('recipeModal').classList.remove('show')}
document.getElementById('recipeModal').addEventListener('click',function(e){if(e.target===this)closeRecipe()})

function addToCart(n){cart[n]=(cart[n]||0)+1;saveCart();showToast('已加入：'+n)}
function removeFromCart(n){if(cart[n]>1)cart[n]--;else delete cart[n];saveCart();renderCartItems()}
function saveCart(){localStorage.setItem('preg_cart',JSON.stringify(cart));updateBar()}
function updateBar(){var ks=Object.keys(cart);var n=0;for(var i=0;i<ks.length;i++)n+=cart[ks[i]];document.getElementById('cartCount').textContent=n===0?'未选菜品':'已选 '+n+' 道菜';document.getElementById('cartBtn').disabled=n===0}
function openCart(){document.getElementById('cartModal').classList.add('show');renderCartItems()}
function closeCart(){document.getElementById('cartModal').classList.remove('show')}
function renderCartItems(){var ks=Object.keys(cart);var c=document.getElementById('cartItems');if(ks.length===0){c.innerHTML='<div class="empty-cart">🛒 还没选菜呢~</div>';return}var h='';for(var i=0;i<ks.length;i++){var n=ks[i];h+='<div class="cart-item"><span class="cart-item-name">'+n+'</span><button class="cart-item-btn minus" onclick="removeFromCart(\''+esc(n)+'\')">−</button><span class="cart-item-qty">'+cart[n]+'</span><button class="cart-item-btn" onclick="addToCart(\''+esc(n)+'\')">+</button></div>'}c.innerHTML=h}
function submitOrder(){var ks=Object.keys(cart);if(ks.length===0)return;var items=[];for(var i=0;i<ks.length;i++){items.push({name:ks[i],qty:cart[ks[i]]})}var note=document.getElementById('orderNote').value.trim();var d=new Date();var ts=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');orders.unshift({id:Date.now(),items:items,note:note,time:ts,done:false});localStorage.setItem('preg_orders',JSON.stringify(orders));cart={};saveCart();closeCart();document.getElementById('orderNote').value='';showToast('💝 告诉老公啦！等着吃好吃的~');renderHistory()}
function toggleHistory(){var c=document.getElementById('historyContent');var t=document.getElementById('historyTitle');if(c.style.display==='none'){c.style.display='block';t.textContent='📋 收起点单记录 ▲';renderHistory()}else{c.style.display='none';t.textContent='📋 查看老婆的点单记录 ▼'}}
function renderHistory(){var c=document.getElementById('historyContent');if(orders.length===0){c.innerHTML='<div style="text-align:center;color:#999;padding:10px">还没有下过单呢~</div>';return}var h='';for(var i=0;i<orders.length;i++){var o=orders[i];h+='<div class="history-item"><div class="hi-info"><div class="hi-time">'+o.time+'</div><div class="hi-items">';for(var j=0;j<o.items.length;j++){if(j>0)h+='、';h+=o.items[j].name+(o.items[j].qty>1?' x'+o.items[j].qty:'')}h+='</div>';if(o.note)h+='<div class="hi-note">💬 '+o.note+'</div>';h+='</div><div class="history-actions"><span class="status-badge '+(o.done?'done':'pending')+'">'+(o.done?'✅ 已做':'⏳ 待做')+'</span><div><button class="history-action-btn" style="background:#e8f5e9;color:#4caf50" onclick="toggleDone('+o.id+')">'+(o.done?'↩':'✅')+'</button><button class="history-action-btn" style="background:#fde8e5;color:#d4786e;margin-left:2px" onclick="delOrder('+o.id+')">🗑</button></div></div></div>'}c.innerHTML=h}
function toggleDone(id){for(var i=0;i<orders.length;i++){if(orders[i].id===id){orders[i].done=!orders[i].done;break}}localStorage.setItem('preg_orders',JSON.stringify(orders));renderHistory()}
function delOrder(id){orders=orders.filter(function(o){return o.id!==id});localStorage.setItem('preg_orders',JSON.stringify(orders));renderHistory();showToast('已删除')}
function showToast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},2000)}
renderTabs();renderTags();renderMenu();updateBar();
</script>
</body>
</html>
